name: Verify Docker dev image build

on:
  pull_request:
    branches: [develop, main, master, astrofoley-patch-1]
    paths:
      - "docker/Dockerfile.web.dev"
      - "docker/requirements.web.dev"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./docker/
          file: ./docker/Dockerfile.web.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prune local build artifacts
        if: always()
        run: bash docker/scripts/prune-yse-docker.sh aggressive